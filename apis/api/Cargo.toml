[package]
name = "api"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
vespera = "0.1.51"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
sea-orm = { version = "2.0.0-rc.38", features = ["runtime-tokio-rustls", "sqlx-postgres", "sqlx-sqlite", "macros", "chrono", "uuid"] }
vespertide = "0.1.61"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
sha2 = "0.10"

[dev-dependencies]
# 통합 테스트: in-process Router 요청/응답 (oneshot) 용도
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[build-dependencies]
vespera = "0.1.51"
