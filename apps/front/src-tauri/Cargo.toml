[package]
name = "portsyncai-worker"
version = "0.1.0"
description = "PortSyncAI worker mobile application"
authors = ["PortSyncAI"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "portsyncai_worker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-nfc = "2"

[workspace]
