name: "🐛 Fix"
description: "버그 수정"
labels: ["fix"]
title: "[Fix] "
body:
  - type: textarea
    attributes:
      label: 📄 버그 설명
      description: 무엇이 잘못 동작하는지 작성해 주세요.
      placeholder: 예) FK 컬럼명이 _id로 끝나지 않으면 엔티티 생성 시 컴파일 에러 발생
    validations:
      required: true
  - type: textarea
    attributes:
      label: 🔁 재현 방법
      description: 어떤 순서로 하면 재현되는지 적어 주세요.
      placeholder: |
        1. vespertide export --orm seaorm 실행
        2. cargo check
        3. E0124 에러 발생
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 작업할 내용
      description: 수정할 항목을 체크박스로 작성해 주세요.
    validations:
      required: false
